<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
TITI'S WISH ♡
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- FLOATING DECOR -->

<div class="floating-stickers">

<img src="images/db.jpeg" class="pompompurin p1">
<img src="images/db.jpeg" class="pompompurin p2">
<img src="images/db.jpeg" class="pompompurin p3">

<span class="white-heart h1">♡</span>
<span class="white-heart h2">♡</span>
<span class="white-heart h3">♡</span>

</div>





<main class="page">


<div class="issue">

MAKE A WISH ♡

</div>




<h1>
🎂 Make Your Birthday Wish
</h1>



<p>
Close your eyes, make a wish, and blow the candles ♡
</p>





<!-- ===============================
SAVED CAKE FROM CAKE PAGE
================================ -->


<div id="wish-cake">

</div>





<!-- ===============================
BLOW CANDLE BUTTON
================================ -->


<button id="blow-candle">

💨 Blow Candles

</button>







<!-- ===============================
WISH CARD
================================ -->


<div class="postcard">


<h2>
💌 Write Your Wish
</h2>



<textarea 
id="wish-input"
placeholder="Write your birthday wish here ♡">
</textarea>




<button id="save-wish">

Save Wish ♡

</button>




<div id="saved-wish">

</div>


</div>







<button onclick="location.href='index.html'">

♡ Back Home

</button>

<div id="celebration">

    <div class="fireworks"></div>

    <div class="congrats-box">

        <h1>
        🎉 Congratulations ♡
        </h1>

        <p>
        Your wish has been made ✨<br>
        May all your dreams come true.
        I love uuuuu <3
        </p>

        <button id="close-celebration">
            Keep celebrating ♡
        </button>

    </div>

</div>

</main>







<!-- MUSIC -->


<audio id="music" loop>

<source src="music/Thaiboy_Digital_-_B_with_U_KLICKAUD.mp3">

</audio>




<button id="music-btn">

🎧 Play

</button>






<!-- MAIN JS -->

<script src="script.js"></script>


</body>

</html>
